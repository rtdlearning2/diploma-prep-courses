<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eye Anatomy Drag-and-Drop</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #dbeafe;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --text: #111827;
      --label-text: #374151;
      --muted: #4b5563;
      --border: #d1d5db;
      --panel: #ffffff;
      --bg: #f8fafc;
      --shadow: 0 8px 18px rgba(15, 23, 42, 0.09);
      --hotspot-size: 26px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: #eef2f7;
      color: var(--text);
    }

    .slide-stage {
      width: 100vw;
      height: 100vh;
      aspect-ratio: 16 / 9;
      max-width: calc(100vh * 16 / 9);
      max-height: calc(100vw * 9 / 16);
      margin: auto;
      position: absolute;
      inset: 0;
      background: var(--bg);
      overflow: hidden;
      display: grid;
      grid-template-rows: 68px 1fr;
    }

    header {
      padding: 8px 24px 6px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.04;
      letter-spacing: -0.035em;
      font-weight: 800;
    }

    .instructions {
      margin: 5px 0 0;
      font-size: 13.5px;
      color: #243244;
      font-weight: 700;
      line-height: 1.15;
      animation: instructionFloat 1.1s ease-out both;
    }

    @keyframes instructionFloat {
      0% { opacity: 0; transform: translateY(10px); }
      70% { opacity: 1; transform: translateY(-2px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .main {
      min-height: 0;
      padding: 8px 12px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 448px;
      gap: 12px;
    }

    .diagram-card,
    .activity-card {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .diagram-card {
      border-radius: 14px;
      padding: 8px;
      display: flex;
    }

    .image-stage {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: 1px solid #eef2f7;
      background: #ffffff;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .image-canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 1536 / 1152;
      max-width: 100%;
      max-height: 100%;
    }

    .image-canvas img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .leader-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .leader-line {
      stroke: rgba(37, 99, 235, 0.72);
      stroke-width: 1.35;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      transition: opacity 0.18s ease, stroke 0.18s ease;
    }

    .leader-dot {
      fill: #ffffff;
      stroke: rgba(37, 99, 235, 0.86);
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
      transition: opacity 0.18s ease, fill 0.18s ease, stroke 0.18s ease;
    }

    .leader-line.correct {
      stroke: rgba(22, 163, 74, 0.76);
    }

    .leader-dot.correct {
      fill: #dcfce7;
      stroke: #16a34a;
    }

    .leader-line.hidden,
    .leader-dot.hidden,
    .diagram-number.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .diagram-number {
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      width: var(--hotspot-size);
      height: var(--hotspot-size);
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.94);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.24);
      z-index: 2;
      transition: opacity 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .diagram-number.correct {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(22,163,74,0.16), 0 3px 8px rgba(0,0,0,0.24);
    }

    .diagram-number.pop { animation: markerPop 0.36s ease-out; }

    @keyframes markerPop {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.16); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .activity-card {
      border-radius: 0;
      padding: 11px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 5px;
      overflow: hidden;
    }

    .activity-card.wrapup-mode {
      grid-template-rows: 1fr;
      background: #ffffff;
      border-color: var(--border);
      animation: panelSwap 0.45s ease-out both;
    }

    @keyframes panelSwap {
      0% { opacity: 0.2; transform: translateX(10px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .score {
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.02em;
      margin-bottom: 0;
    }

    .status { display: none; }

    .match-area {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 9px;
      overflow: hidden;
    }

    .column {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .column-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #374151;
      margin-bottom: 0;
      line-height: 1.1;
    }

    .labels,
    .slots {
      min-height: 0;
      overflow: hidden;
      display: grid;
      align-content: start;
      gap: 3px;
      padding-right: 0;
    }

    .label-chip {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 9px;
      padding: 4px 7px;
      min-height: 27px;
      display: flex;
      align-items: center;
      font-size: 12px;
      line-height: 1.08;
      font-weight: 680;
      color: var(--label-text);
      cursor: grab;
      user-select: none;
      box-shadow: 0 1px 4px rgba(15,23,42,0.08);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      touch-action: none;
    }

    .label-chip:hover,
    .label-chip:focus-visible {
      border-color: var(--blue);
      background: var(--blue-soft);
      outline: none;
    }

    .label-chip.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }

    .slot-row {
      display: grid;
      grid-template-columns: 25px 1fr;
      gap: 5px;
      align-items: center;
      min-height: 27px;
    }

    .slot-number {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--blue);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      justify-self: center;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
      transition: background 0.18s ease;
    }

    .slot-number.correct { background: var(--green); }

    .drop-slot {
      min-height: 27px;
      border: 2px solid #cbd5e1;
      border-radius: 9px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      padding: 4px 6px;
      font-size: 9px;
      font-weight: 500;
      color: #9ca3af;
      line-height: 1.1;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .drop-slot::before { content: "Drop label here"; }

    .drop-slot.drag-over {
      background: var(--blue-soft);
      border-color: var(--blue);
      transform: scale(1.015);
    }

    .drop-slot.correct {
      background: var(--green-soft);
      border-color: #22c55e;
      color: #166534;
      font-size: 11px;
      font-weight: 750;
      animation: answerSettle 0.34s ease-out both;
    }

    .drop-slot.correct::before { content: ""; }

    @keyframes answerSettle {
      0% { opacity: 0.45; transform: translateY(-3px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .drop-slot.incorrect {
      background: var(--red-soft);
      border-color: var(--red);
      animation: shake 0.25s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .placed-text::after {
      content: " ✓";
      font-weight: 900;
    }

    .bottom-area {
      display: grid;
      gap: 5px;
    }

    .completion-prompt {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 0 0 3px;
      margin-top: -22px;
      animation: wrapupIn 0.35s ease-out both;
    }

    .completion-prompt.show { display: flex; }

    .completion-prompt span {
      font-size: 15px;
      color: #111827;
      font-weight: 600;
    }

    .bottom-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: start;
    }

    .utility-button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 999px;
      padding: 7px 9px;
      font-weight: 800;
      cursor: pointer;
      font-size: 11.5px;
      font-family: inherit;
    }

    .utility-button:hover,
    .utility-button:focus-visible {
      border-color: var(--blue);
      color: var(--blue-dark);
      outline: none;
    }

    .utility-button:disabled {
      opacity: 0.62;
      cursor: default;
    }

    .wrapup-panel {
      display: none;
      height: 100%;
      min-height: 0;
    }

    .wrapup-start-button {
      border: 1px solid #15803d;
      background: #16a34a;
      color: #ffffff;
      border-radius: 999px;
      padding: 11px 22px;
      font-weight: 850;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 18px rgba(22, 163, 74, 0.25);
      line-height: 1;
      min-width: 108px;
    }

    .wrapup-start-button:hover,
    .wrapup-start-button:focus-visible {
      background: #15803d;
      outline: none;
    }

    .wrapup-mode.notes-mode .wrapup-panel {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
      padding: 5px 3px;
      animation: wrapupIn 0.55s ease-out both;
    }

    .wrapup-mode.notes-mode .activity-content { display: none; }

    @keyframes wrapupIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .notes-card {
      border: 1px solid #bbd7ad;
      background: #eef8e9;
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 11px;
      min-height: 0;
    }

    .notes-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .notes-title {
      font-weight: 850;
      color: #1f2937;
      font-size: 20px;
      letter-spacing: -0.025em;
    }

    .notes-count {
      color: #4b5563;
      font-weight: 750;
      font-size: 13px;
      white-space: nowrap;
    }

    .note-text {
      font-size: 19px;
      line-height: 1.32;
      color: #111827;
      align-self: center;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .note-text.fade-out {
      opacity: 0;
      transform: translateY(5px);
    }

    .note-text.fade-in { animation: noteFadeIn 0.35s ease-out both; }

    @keyframes noteFadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .note-text strong { font-weight: 850; }

    .notes-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .note-button {
      border: 1px solid #a7c99c;
      background: #ffffff;
      color: #1f2937;
      border-radius: 999px;
      padding: 8px 13px;
      font-weight: 850;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .note-button:hover,
    .note-button:focus-visible {
      border-color: var(--green);
      color: #166534;
      outline: none;
    }

    .note-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .note-dots {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .note-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b7cbb0;
    }

    .note-dot.active {
      width: 24px;
      border-radius: 999px;
      background: var(--green);
    }

    .wrapup-controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 1050px) {
      .slide-stage { grid-template-rows: 68px 1fr; }
      .main { grid-template-columns: minmax(0, 1fr) 426px; gap: 11px; }
      h1 { font-size: 23px; }
      .instructions { font-size: 13px; }
      .label-chip { font-size: 11.5px; min-height: 26px; }
      .slot-row { min-height: 26px; }
      .drop-slot { font-size: 8.5px; min-height: 26px; }
      .drop-slot.correct { font-size: 10.5px; }
      .note-text { font-size: 18px; }
    }

      /* ─── Edit mode panel (?edit=1) ────────────────────────────────────────── */
    #editPanel {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 240px;
      background: #1e293b;
      color: #f1f5f9;
      border-radius: 10px;
      padding: 10px 11px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 11px;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.48);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ep-header {
      font-size: 11px;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 5px;
      margin-bottom: 1px;
    }

    .ep-label {
      font-size: 8px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    .ep-info {
      font-size: 11px;
      color: #e2e8f0;
      word-break: break-word;
      line-height: 1.3;
    }

    .ep-coords {
      font-family: "Courier New", monospace;
      font-size: 12px;
      color: #67e8f9;
      font-weight: 700;
    }

    .ep-hint {
      font-size: 9px;
      color: #94a3b8;
      line-height: 1.45;
      margin: 2px 0;
    }

    .ep-hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 3px 0;
    }

    .ep-btn {
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
      border-radius: 5px;
      padding: 5px 7px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      width: 100%;
    }

    .ep-btn:hover {
      background: #475569;
      border-color: #94a3b8;
    }

    .ep-btn-primary {
      background: #1d4ed8;
      border-color: #3b82f6;
      color: #fff;
    }

    .ep-btn-primary:hover {
      background: #2563eb;
      border-color: #60a5fa;
    }

    .ep-output {
      width: 100%;
      background: #0f172a;
      color: #86efac;
      border: 1px solid #1e3a5f;
      border-radius: 5px;
      font-family: "Courier New", monospace;
      font-size: 8.5px;
      padding: 4px;
      resize: vertical;
      min-height: 72px;
      margin-top: 1px;
    }

    .edit-mode .diagram-number {
      transition: none;
      cursor: grab;
    }

    .edit-mode .leader-lines {
      pointer-events: all;
    }

    .edit-mode .leader-dot {
      pointer-events: all;
      cursor: grab;
    }

    .edit-mode .leader-line {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="slide-stage">
    <header>
      <h1>Eye Anatomy Drag-and-Drop</h1>
      <p class="instructions">Drag each label into the matching numbered box. Correct answers turn green and lock in place.</p>
    </header>

    <section class="main" aria-label="Eye anatomy drag-and-drop activity">
      <div class="diagram-card">
        <div class="image-stage">
          <div class="image-canvas" id="imageStage">
            <img
              src="eye_image.png"
              alt="Unlabelled cross-section diagram of the human eye for a drag-and-drop labelling activity."
            />
            <svg class="leader-lines" id="leaderLines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          </div>
        </div>
      </div>

      <aside class="activity-card" id="activityCard">
        <div class="activity-content">
          <div class="score" id="score">Score: 0/10</div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>

        <div class="match-area activity-content">
          <div class="column">
            <div class="column-title">Labels</div>
            <div class="labels" id="labels" aria-label="Draggable eye anatomy labels"></div>
          </div>

          <div class="column">
            <div class="column-title">Matching boxes</div>
            <div class="slots" id="slots" aria-label="Numbered answer slots"></div>
          </div>
        </div>

        <div class="bottom-area activity-content">
          <div class="completion-prompt" id="completionPrompt">
            <span>Great work!</span>
            <button class="wrapup-start-button" id="startWrapupButton" type="button">Wrap Up</button>
          </div>

          <div class="bottom-controls">
            <button class="utility-button" id="shuffleButton" type="button">Shuffle labels</button>
            <button class="utility-button" id="keyButton" type="button">Show answer key</button>
            <button class="utility-button" id="resetButton" type="button">Reset</button>
          </div>
        </div>

        <section class="wrapup-panel" aria-label="Study notes">
          <div class="notes-card">
            <div class="notes-top">
              <div class="notes-title">Study Notes</div>
              <div class="notes-count" id="notesCount">Note 1 of 5</div>
            </div>
            <div class="note-text" id="noteText"></div>
            <div class="notes-nav">
              <button class="note-button" id="prevNoteButton" type="button">Back</button>
              <div class="note-dots" id="noteDots" aria-hidden="true"></div>
              <button class="note-button" id="nextNoteButton" type="button">Next</button>
            </div>
          </div>

          <div class="wrapup-controls">
            <button class="utility-button" id="wrapupResetButton" type="button">Reset activity</button>
          </div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const parts = [
      { id: 1, name: "Sclera", x: "21.9%", y: "17.5%", tx: "32.9%", ty: "20.9%" },
      { id: 2, name: "Choroid", x: "27.5%", y: "10.0%", tx: "40.2%", ty: "17.2%" },
      { id: 3, name: "Retina", x: "40.7%", y: "2.4%", tx: "48.2%", ty: "15.1%" },
      { id: 4, name: "Vitreous humour", x: "66.9%", y: "6.2%", tx: "54.8%", ty: "25.9%" },
      { id: 5, name: "Aqueous humour", x: "88.7%", y: "31.8%", tx: "76.9%", ty: "36.5%" },
      { id: 6, name: "Cornea", x: "89.0%", y: "44.2%", tx: "82.7%", ty: "43.9%" },
      { id: 7, name: "Lens", x: "67.5%", y: "50.5%", tx: "68.5%", ty: "50.5%" },
      { id: 8, name: "Iris", x: "89.0%", y: "59.5%", tx: "71.7%", ty: "61.4%" },
      { id: 9, name: "Fovea centralis", x: "85.7%", y: "72.6%", tx: "27.3%", ty: "48.5%" },
      { id: 10, name: "Optic nerve", x: "82.7%", y: "87.3%", tx: "21.8%", ty: "64.6%" }
    ];

    const studyNotes = [
      {
        text: "The <strong>sclera (1)</strong>, <strong>choroid (2)</strong>, and <strong>retina (3)</strong> are layers of the eye wall.",
        ids: [1, 2, 3]
      },
      {
        text: "Light passes through the <strong>cornea (6)</strong> and <strong>aqueous humour (5)</strong> before reaching the lens.",
        ids: [6, 5]
      },
      {
        text: "The <strong>iris (8)</strong> controls pupil size, while the <strong>lens (7)</strong> helps focus light.",
        ids: [8, 7]
      },
      {
        text: "The <strong>vitreous humour (4)</strong> fills the large inner space of the eye and helps the eyeball keep its shape.",
        ids: [4]
      },
      {
        text: "The <strong>fovea centralis (9)</strong> supports sharp central vision, and the <strong>optic nerve (10)</strong> carries visual information to the brain.",
        ids: [9, 10]
      }
    ];

    const activityCard = document.getElementById("activityCard");
    const imageStage = document.getElementById("imageStage");
    const leaderLines = document.getElementById("leaderLines");
    const labelsContainer = document.getElementById("labels");
    const slotsContainer = document.getElementById("slots");
    const scoreElement = document.getElementById("score");
    const statusElement = document.getElementById("status");
    const resetButton = document.getElementById("resetButton");
    const wrapupResetButton = document.getElementById("wrapupResetButton");
    const startWrapupButton = document.getElementById("startWrapupButton");
    const completionPrompt = document.getElementById("completionPrompt");
    const shuffleButton = document.getElementById("shuffleButton");
    const keyButton = document.getElementById("keyButton");
    const noteText = document.getElementById("noteText");
    const notesCount = document.getElementById("notesCount");
    const prevNoteButton = document.getElementById("prevNoteButton");
    const nextNoteButton = document.getElementById("nextNoteButton");
    const noteDots = document.getElementById("noteDots");

    let placed = new Set();
    let labelOrder = [];
    let currentNote = 0;

    function pctToNum(value) {
      return Number(String(value).replace("%", ""));
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setStatus(message, type = "neutral") {
      if (!statusElement) return;
      statusElement.innerHTML = message;
      statusElement.classList.remove("good", "bad");
      if (type === "good") statusElement.classList.add("good");
      if (type === "bad") statusElement.classList.add("bad");
    }

    function updateScore() {
      scoreElement.textContent = `Score: ${placed.size}/${parts.length}`;
      if (placed.size === parts.length) {
        showCompletionPrompt();
      }
    }

    function createLeaderLines() {
      leaderLines.innerHTML = "";

      parts.forEach(part => {
        const x1 = pctToNum(part.x);
        const y1 = pctToNum(part.y);
        const x2 = pctToNum(part.tx);
        const y2 = pctToNum(part.ty);
        const needsLine = Math.abs(x1 - x2) > 2 || Math.abs(y1 - y2) > 2;

        if (!needsLine) return;

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.classList.add("leader-line");
        line.dataset.partId = part.id;

        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", x2);
        dot.setAttribute("cy", y2);
        dot.setAttribute("r", "0.9");
        dot.classList.add("leader-dot");
        dot.dataset.partId = part.id;

        leaderLines.appendChild(line);
        leaderLines.appendChild(dot);
      });
    }

    function createDiagramNumbers() {
      imageStage.querySelectorAll(".diagram-number").forEach(number => number.remove());
      createLeaderLines();

      parts.forEach(part => {
        const marker = document.createElement("div");
        marker.className = "diagram-number";
        marker.textContent = part.id;
        marker.dataset.partId = part.id;
        marker.style.setProperty("--x", part.x);
        marker.style.setProperty("--y", part.y);
        imageStage.appendChild(marker);
      });
    }

    function createLabels() {
      labelsContainer.innerHTML = "";
      labelOrder
        .filter(part => !placed.has(part.id))
        .forEach(part => {
          const chip = document.createElement("div");
          chip.className = "label-chip";
          chip.textContent = part.name;
          chip.tabIndex = 0;
          chip.draggable = true;
          chip.dataset.partId = part.id;

          chip.addEventListener("dragstart", event => {
            chip.classList.add("dragging");
            event.dataTransfer.setData("text/plain", String(part.id));
            event.dataTransfer.effectAllowed = "move";
          });

          chip.addEventListener("dragend", () => {
            chip.classList.remove("dragging");
          });

          labelsContainer.appendChild(chip);
        });
    }

    function createSlots() {
      slotsContainer.innerHTML = "";

      parts.forEach(part => {
        const row = document.createElement("div");
        row.className = "slot-row";

        const number = document.createElement("div");
        number.className = "slot-number";
        number.textContent = part.id;
        number.dataset.partId = part.id;

        const slot = document.createElement("div");
        slot.className = "drop-slot";
        slot.dataset.partId = part.id;
        slot.setAttribute("aria-label", `Drop answer for number ${part.id}`);

        slot.addEventListener("dragover", event => {
          if (placed.has(part.id)) return;
          event.preventDefault();
          slot.classList.add("drag-over");
        });

        slot.addEventListener("dragleave", () => {
          slot.classList.remove("drag-over");
        });

        slot.addEventListener("drop", event => {
          event.preventDefault();
          slot.classList.remove("drag-over");
          if (placed.has(part.id)) return;
          const draggedId = Number(event.dataTransfer.getData("text/plain"));
          checkAnswer(draggedId, part.id, slot);
        });

        row.appendChild(number);
        row.appendChild(slot);
        slotsContainer.appendChild(row);
      });
    }

    function setCorrectAnswer(part, showMessage = true) {
      placed.add(part.id);

      const slot = slotsContainer.querySelector(`.drop-slot[data-part-id="${part.id}"]`);
      if (slot) {
        slot.classList.remove("incorrect", "drag-over");
        slot.classList.add("correct");
        slot.innerHTML = `<span class="placed-text">${part.name}</span>`;
      }

      const slotNumber = slotsContainer.querySelector(`.slot-number[data-part-id="${part.id}"]`);
      if (slotNumber) slotNumber.classList.add("correct");

      const marker = imageStage.querySelector(`.diagram-number[data-part-id="${part.id}"]`);
      if (marker) {
        marker.classList.add("correct", "pop");
        window.setTimeout(() => marker.classList.remove("pop"), 400);
      }

      const line = leaderLines.querySelector(`.leader-line[data-part-id="${part.id}"]`);
      const dot = leaderLines.querySelector(`.leader-dot[data-part-id="${part.id}"]`);
      if (line) line.classList.add("correct");
      if (dot) dot.classList.add("correct");

      if (showMessage) {
        setStatus(`<strong>Correct!</strong> ${part.name} matches number ${part.id}.`, "good");
      }
    }

    function checkAnswer(labelId, targetId, slot) {
      const label = parts.find(part => part.id === labelId);
      const target = parts.find(part => part.id === targetId);
      if (!label || !target) return;

      if (labelId === targetId) {
        setCorrectAnswer(label, true);
        createLabels();
        updateScore();
      } else {
        slot.classList.add("incorrect");
        setStatus(`<strong>Try again.</strong> ${label.name} does not match number ${targetId}.`, "bad");
        window.setTimeout(() => slot.classList.remove("incorrect"), 300);
      }
    }

    function showOnlyRelevantNumbers(ids = null) {
      const activeIds = ids ? new Set(ids.map(Number)) : null;

      imageStage.querySelectorAll(".diagram-number").forEach(marker => {
        const id = Number(marker.dataset.partId);
        marker.classList.toggle("hidden", activeIds !== null && !activeIds.has(id));
      });

      leaderLines.querySelectorAll(".leader-line, .leader-dot").forEach(item => {
        const id = Number(item.dataset.partId);
        item.classList.toggle("hidden", activeIds !== null && !activeIds.has(id));
      });
    }

    function resetActivity() {
      placed = new Set();
      labelOrder = shuffle(parts);
      activityCard.classList.remove("wrapup-mode", "notes-mode");
      completionPrompt.classList.remove("show");
      createDiagramNumbers();
      createSlots();
      createLabels();
      scoreElement.textContent = `Score: 0/${parts.length}`;
      setStatus("Drag a label from the left column into the correct numbered box.");
      keyButton.textContent = "Show answer key";
      keyButton.disabled = false;
      shuffleButton.disabled = false;
      showOnlyRelevantNumbers(null);
      showNote(0, false);
    }

    function shuffleUnplacedLabels() {
      const unplaced = shuffle(labelOrder.filter(part => !placed.has(part.id)));
      const placedParts = labelOrder.filter(part => placed.has(part.id));
      labelOrder = [...unplaced, ...placedParts];
      createLabels();
    }

    function revealAnswerKey() {
      const remaining = parts.filter(part => !placed.has(part.id));

      if (remaining.length === 0) {
        showWrapupPanel();
        return;
      }

      setStatus("Answer key revealed. Correct labels are being placed in green.", "good");

      remaining.forEach((part, index) => {
        window.setTimeout(() => {
          setCorrectAnswer(part, false);
          createLabels();
          updateScore();
        }, index * 130);
      });

      keyButton.textContent = "Answer key shown";
      keyButton.disabled = true;
    }

    function createNoteDots() {
      noteDots.innerHTML = "";
      studyNotes.forEach((_, index) => {
        const dot = document.createElement("span");
        dot.className = "note-dot";
        if (index === currentNote) dot.classList.add("active");
        noteDots.appendChild(dot);
      });
    }

    function showNote(index, animate = true) {
      currentNote = Math.max(0, Math.min(index, studyNotes.length - 1));

      const update = () => {
        const note = studyNotes[currentNote];
        noteText.innerHTML = note.text;
        notesCount.textContent = `Note ${currentNote + 1} of ${studyNotes.length}`;
        prevNoteButton.disabled = currentNote === 0;
        nextNoteButton.disabled = currentNote === studyNotes.length - 1;
        createNoteDots();

        if (activityCard.classList.contains("notes-mode")) {
          showOnlyRelevantNumbers(note.ids);
        }

        noteText.classList.remove("fade-out");
        if (animate) {
          noteText.classList.remove("fade-in");
          void noteText.offsetWidth;
          noteText.classList.add("fade-in");
        }
      };

      if (animate) {
        noteText.classList.add("fade-out");
        window.setTimeout(update, 170);
      } else {
        update();
      }
    }

    function showCompletionPrompt() {
      completionPrompt.classList.add("show");
      shuffleButton.disabled = true;
    }

    function showWrapupPanel() {
      showCompletionPrompt();
    }

    function startStudyNotes() {
      activityCard.classList.add("wrapup-mode", "notes-mode");
      showNote(0, false);
      window.setTimeout(() => showNote(1, true), 2800);
    }

    prevNoteButton.addEventListener("click", () => showNote(currentNote - 1, true));
    nextNoteButton.addEventListener("click", () => showNote(currentNote + 1, true));
    resetButton.addEventListener("click", resetActivity);
    wrapupResetButton.addEventListener("click", resetActivity);
    startWrapupButton.addEventListener("click", startStudyNotes);
    shuffleButton.addEventListener("click", shuffleUnplacedLabels);
    keyButton.addEventListener("click", revealAnswerKey);

    // ─── Edit mode (?edit=1) ─────────────────────────────────────────────────
    // Add ?edit=1 to the URL to drag marker circles and target dots.
    // Blue numbered circles update x/y.
    // Orange target dots update tx/ty.
    // Click "Copy parts array" after adjusting placements.
    (function initEditMode() {
      if (!new URLSearchParams(window.location.search).has("edit")) return;

      document.body.classList.add("edit-mode");

      const panel = document.createElement("div");
      panel.id = "editPanel";
      panel.innerHTML =
        '<div class="ep-header">✏ Edit Mode</div>' +
        '<div class="ep-label">Selected</div>' +
        '<div class="ep-info" id="epSelected">—</div>' +
        '<div class="ep-label">Coordinates</div>' +
        '<div class="ep-info ep-coords" id="epCoords">x: —&nbsp; y: —</div>' +
        '<div class="ep-hint">Drag blue numbered circles to move labels.<br>' +
        'Drag orange endpoint dots to move leader-line targets.<br>' +
        'Student drag/drop is disabled in edit mode.</div>' +
        '<hr class="ep-hr">' +
        '<button class="ep-btn ep-btn-primary" id="epCopyParts">📋 Copy parts array</button>' +
        '<textarea id="epOutput" class="ep-output" rows="6" readonly placeholder="Updated code appears here…"></textarea>';

      document.body.appendChild(panel);

      const epSelected = document.getElementById("epSelected");
      const epCoords = document.getElementById("epCoords");
      const epOutput = document.getElementById("epOutput");

      function toPct(clientX, clientY) {
        const rect = imageStage.getBoundingClientRect();
        const xv = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const yv = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
        return { x: xv.toFixed(1) + "%", y: yv.toFixed(1) + "%" };
      }

      function setPanelSelection(label, x, y) {
        epSelected.textContent = label;
        epCoords.textContent = "x: " + x + "   y: " + y;
      }

      function updateLeaderLineStart(partId, x, y) {
        const line = leaderLines.querySelector(`.leader-line[data-part-id="${partId}"]`);
        if (line) {
          line.setAttribute("x1", pctToNum(x));
          line.setAttribute("y1", pctToNum(y));
        }
      }

      function updateLeaderLineEnd(partId, tx, ty) {
        const line = leaderLines.querySelector(`.leader-line[data-part-id="${partId}"]`);
        const dot = leaderLines.querySelector(`.leader-dot[data-part-id="${partId}"]`);

        if (line) {
          line.setAttribute("x2", pctToNum(tx));
          line.setAttribute("y2", pctToNum(ty));
        }

        if (dot) {
          dot.setAttribute("cx", pctToNum(tx));
          dot.setAttribute("cy", pctToNum(ty));
        }
      }

      function attachMarkerDrag(marker) {
        if (marker.dataset.editAttached === "true") return;
        marker.dataset.editAttached = "true";

        let dragging = false;

        marker.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          dragging = true;
          marker.setPointerCapture(event.pointerId);
          marker.style.cursor = "grabbing";
          marker.style.boxShadow = "0 0 0 3px #f59e0b, 0 3px 8px rgba(0,0,0,0.35)";
          marker.style.zIndex = "20";
        });

        marker.addEventListener("pointermove", event => {
          if (!dragging) return;

          const { x, y } = toPct(event.clientX, event.clientY);
          const partId = Number(marker.dataset.partId);
          const part = parts.find(p => p.id === partId);
          if (!part) return;

          part.x = x;
          part.y = y;

          marker.style.setProperty("--x", x);
          marker.style.setProperty("--y", y);
          updateLeaderLineStart(partId, x, y);

          setPanelSelection(`#${part.id} ${part.name} marker`, x, y);
        });

        marker.addEventListener("pointerup", () => {
          if (!dragging) return;
          dragging = false;
          marker.style.cursor = "grab";
          marker.style.boxShadow = "";
          marker.style.zIndex = "";
        });

        marker.addEventListener("pointercancel", () => {
          dragging = false;
          marker.style.cursor = "grab";
          marker.style.boxShadow = "";
          marker.style.zIndex = "";
        });
      }

      function attachTargetDotDrag(dot) {
        if (dot.dataset.editAttached === "true") return;
        dot.dataset.editAttached = "true";

        dot.setAttribute("r", "1.8");
        dot.style.fill = "#f97316";
        dot.style.stroke = "#c2410c";
        dot.style.cursor = "grab";

        let dragging = false;

        dot.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          dragging = true;
          dot.setPointerCapture(event.pointerId);
          dot.setAttribute("r", "2.5");
        });

        dot.addEventListener("pointermove", event => {
          if (!dragging) return;

          const { x, y } = toPct(event.clientX, event.clientY);
          const partId = Number(dot.dataset.partId);
          const part = parts.find(p => p.id === partId);
          if (!part) return;

          part.tx = x;
          part.ty = y;

          updateLeaderLineEnd(partId, x, y);
          setPanelSelection(`#${part.id} ${part.name} target`, x, y);
        });

        dot.addEventListener("pointerup", () => {
          if (!dragging) return;
          dragging = false;
          dot.setAttribute("r", "1.8");
        });

        dot.addEventListener("pointercancel", () => {
          dragging = false;
          dot.setAttribute("r", "1.8");
        });
      }

      function disableStudentDrag() {
        labelsContainer.querySelectorAll(".label-chip").forEach(chip => {
          chip.draggable = false;
          chip.style.cursor = "not-allowed";
          chip.style.opacity = "0.38";
          chip.title = "Disabled in edit mode";
        });
      }

      function attachEditableElements() {
        imageStage.querySelectorAll(".diagram-number").forEach(attachMarkerDrag);
        leaderLines.querySelectorAll(".leader-dot").forEach(attachTargetDotDrag);
        disableStudentDrag();
      }

      new MutationObserver(() => attachEditableElements())
        .observe(imageStage, { childList: true, subtree: true });

      new MutationObserver(() => attachEditableElements())
        .observe(leaderLines, { childList: true, subtree: true });

      new MutationObserver(() => disableStudentDrag())
        .observe(labelsContainer, { childList: true });

      function copyPartsArray() {
        const text = "const parts = " + JSON.stringify(parts, null, 2) + ";";
        epOutput.value = text;
        try { epOutput.select(); } catch (err) {}
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
      }

      document.getElementById("epCopyParts").addEventListener("click", copyPartsArray);

      attachEditableElements();
    })();

    // ─── Debug mode (?debug=1) ────────────────────────────────────────────────
    // Add ?debug=1 to show a coordinate grid and target labels.
    (function initDebugMode() {
      if (!new URLSearchParams(window.location.search).has("debug")) return;

      const NS = "http://www.w3.org/2000/svg";

      const gridSvg = document.createElementNS(NS, "svg");
      gridSvg.className = "debug-grid-svg";
      gridSvg.setAttribute("viewBox", "0 0 100 100");
      gridSvg.setAttribute("preserveAspectRatio", "none");
      gridSvg.setAttribute("aria-hidden", "true");
      gridSvg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;overflow:visible;";

      for (let i = 5; i < 100; i += 5) {
        const isMajor = i % 10 === 0;

        const vertical = document.createElementNS(NS, "line");
        vertical.setAttribute("x1", i);
        vertical.setAttribute("y1", 0);
        vertical.setAttribute("x2", i);
        vertical.setAttribute("y2", 100);
        vertical.setAttribute("stroke", isMajor ? "rgba(220,38,38,0.35)" : "rgba(37,99,235,0.18)");
        vertical.setAttribute("stroke-width", "0.3");
        vertical.setAttribute("vector-effect", "non-scaling-stroke");
        gridSvg.appendChild(vertical);

        const horizontal = document.createElementNS(NS, "line");
        horizontal.setAttribute("x1", 0);
        horizontal.setAttribute("y1", i);
        horizontal.setAttribute("x2", 100);
        horizontal.setAttribute("y2", i);
        horizontal.setAttribute("stroke", isMajor ? "rgba(220,38,38,0.35)" : "rgba(37,99,235,0.18)");
        horizontal.setAttribute("stroke-width", "0.3");
        horizontal.setAttribute("vector-effect", "non-scaling-stroke");
        gridSvg.appendChild(horizontal);

        if (isMajor) {
          const xLabel = document.createElement("div");
          xLabel.className = "debug-grid-label";
          xLabel.textContent = i + "%";
          xLabel.style.cssText = `position:absolute;left:${i}%;top:2.5%;transform:translate(-50%,-50%);font-size:8px;color:rgba(220,38,38,0.75);pointer-events:none;z-index:22;font-weight:800;background:#fff;padding:0 1px;border-radius:2px;`;
          imageStage.appendChild(xLabel);

          const yLabel = document.createElement("div");
          yLabel.className = "debug-grid-label";
          yLabel.textContent = i + "%";
          yLabel.style.cssText = `position:absolute;left:1.8%;top:${i}%;transform:translate(-50%,-50%);font-size:8px;color:rgba(220,38,38,0.75);pointer-events:none;z-index:22;font-weight:800;background:#fff;padding:0 1px;border-radius:2px;`;
          imageStage.appendChild(yLabel);
        }
      }

      imageStage.appendChild(gridSvg);

      function renderDebugLabels() {
        imageStage.querySelectorAll(".debug-target-dot, .debug-target-label").forEach(el => el.remove());

        parts.forEach(part => {
          const dot = document.createElement("div");
          dot.className = "debug-target-dot";
          dot.style.cssText = `position:absolute;left:${part.tx};top:${part.ty};width:8px;height:8px;background:#dc2626;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);z-index:23;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,0.3);`;
          imageStage.appendChild(dot);

          const label = document.createElement("div");
          label.className = "debug-target-label";
          label.textContent = `${part.id}: ${part.name}`;
          label.style.cssText = `position:absolute;left:${part.tx};top:${part.ty};transform:translate(-50%,calc(-50% + 8px));font-size:9px;font-weight:700;color:#991b1b;background:#fff;border:1px solid rgba(220,38,38,0.5);padding:1px 3px;border-radius:3px;z-index:24;pointer-events:none;white-space:nowrap;line-height:1.3;`;
          imageStage.appendChild(label);
        });
      }

      renderDebugLabels();

      new MutationObserver(() => renderDebugLabels())
        .observe(leaderLines, { childList: true });
    })();

    resetActivity();
  </script>
</body>
</html>
